<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bilandi's Cafe — Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cr:#7A1515;--cr2:#9B1C1C;
  --gold:#C49A2A;--gold2:#E0B838;
  --cream:#FDF6E9;--cream2:#F5EDD8;--cream3:#EDE0C4;
  --white:#fff;--dark:#1A0D00;--muted:#7A6040;--muted2:#9A7A50;
  --green:#2E7D32;
  --border:rgba(122,21,21,0.13);
  --cs:0 2px 12px rgba(122,21,21,0.09);
  --csh:0 6px 24px rgba(122,21,21,0.17);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);font-family:'Nunito',sans-serif;color:var(--dark);overflow-x:hidden;min-height:100vh}

/* NAV */
.nav{background:var(--cr);position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.nav-inner{display:flex;align-items:center;gap:10px;padding:0 14px;height:54px}
.logo{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:900;color:var(--cream);letter-spacing:.04em;line-height:1;white-space:nowrap}
.logo small{display:block;font-family:'Nunito',sans-serif;font-size:9px;font-weight:700;color:rgba(253,246,233,.5);letter-spacing:.18em;text-transform:uppercase;margin-top:1px}
.nav-search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:8px 14px}
.nav-search svg{color:rgba(253,246,233,.45);flex-shrink:0}
.nav-search input{background:none;border:none;outline:none;color:var(--cream);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;width:100%}
.nav-search input::placeholder{color:rgba(253,246,233,.4)}
.nav-link{color:var(--gold2);font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap;display:none}
@media(min-width:480px){.nav-link{display:block}}

/* GOLD LINE */
.gline{height:3px;background:linear-gradient(90deg,var(--cr) 0%,var(--gold) 25%,var(--gold2) 50%,var(--gold) 75%,var(--cr) 100%)}

/* HERO */
.hero{background:linear-gradient(135deg,var(--cr) 0%,#5A0D0D 60%,#3A0808 100%);padding:24px 16px 28px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 100% at 50% 0%,rgba(196,154,42,.16) 0%,transparent 65%)}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,10vw,3.2rem);font-weight:900;color:var(--cream);letter-spacing:.04em;position:relative}
.hero h1 em{color:var(--gold2);font-style:italic}
.hero p{font-size:12px;color:rgba(253,246,233,.55);margin-top:5px;font-weight:700;letter-spacing:.06em;position:relative}

/* CAT CIRCLES */
.cats{background:var(--white);border-bottom:2px solid var(--cream2);padding:16px 0 18px}
.cats-title{font-size:15px;font-weight:900;padding:0 14px;margin-bottom:14px;color:var(--dark)}
.cats-row{display:flex;gap:2px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.cats-row::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s;border:none;background:none}
.cat-btn:hover{transform:translateY(-2px)}
.cat-btn:active{transform:scale(.93)}
.cat-circle{width:68px;height:68px;border-radius:50%;background:var(--cream2);border:2.5px solid transparent;display:flex;align-items:center;justify-content:center;font-size:2.1rem;line-height:1;transition:border-color .2s,box-shadow .2s,background .2s;box-shadow:0 2px 10px rgba(122,21,21,.1)}
.cat-btn.active .cat-circle,.cat-btn:hover .cat-circle{border-color:var(--cr);box-shadow:0 3px 14px rgba(122,21,21,.25);background:rgba(122,21,21,.05)}
.cat-lbl{font-size:10px;font-weight:800;color:var(--dark);text-align:center;line-height:1.2;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-btn.active .cat-lbl{color:var(--cr)}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:22px 12px 110px}

/* SECTION */
.sec{margin-bottom:40px;animation:fadeUp .35s ease both}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border);position:relative}
.sec-head::after{content:'';position:absolute;bottom:-2px;left:0;width:50px;height:2px;background:var(--cr)}
.sec-ico{font-size:1.3rem}
.sec-name{font-family:'Playfair Display',serif;font-size:clamp(1.15rem,4vw,1.45rem);font-weight:700;color:var(--cr);line-height:1}
.sec-count{margin-left:auto;font-size:10px;font-weight:800;color:var(--muted2);background:rgba(122,21,21,.07);border:1px solid var(--border);padding:3px 9px;border-radius:100px;white-space:nowrap}

/* ITEMS LIST — always single column on mobile */
.items-list{display:flex;flex-direction:column;gap:9px}
@media(min-width:580px){
  .items-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
}

/* CARD */
.card{background:var(--white);border:1px solid rgba(122,21,21,.09);border-radius:14px;padding:14px 15px;display:flex;align-items:center;gap:11px;box-shadow:var(--cs);transition:box-shadow .2s,border-color .2s,transform .15s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--cr) 0%,var(--gold) 100%);opacity:0;transition:opacity .2s}
.card:hover{box-shadow:var(--csh);border-color:rgba(122,21,21,.22);transform:translateY(-1px)}
.card:hover::before{opacity:1}
.card:active{transform:scale(.99)}
.card.special{border-color:rgba(196,154,42,.38);background:linear-gradient(135deg,#fff 60%,#fffbee 100%)}
.card.special::before{opacity:1;background:linear-gradient(180deg,var(--gold) 0%,var(--cr) 100%)}
.card.highlight{border:2px solid var(--gold);background:linear-gradient(135deg,#fffef5 0%,#fff9e0 100%);box-shadow:0 0 18px rgba(196,154,42,.22),var(--cs);animation:shine 2.2s ease-in-out infinite}
@keyframes shine{0%,100%{box-shadow:0 0 18px rgba(196,154,42,.22),var(--cs)}50%{box-shadow:0 0 30px rgba(196,154,42,.38),var(--csh)}}

.card-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.card-namerow{display:flex;align-items:flex-start;gap:8px}
.veg{flex-shrink:0;width:16px;height:16px;border:1.5px solid var(--green);border-radius:3px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.veg::after{content:'';width:8px;height:8px;background:var(--green);border-radius:50%}
.card-name{font-family:'Playfair Display',serif;font-size:.97rem;font-weight:700;color:var(--dark);line-height:1.3}
.card-name em{color:var(--cr);font-style:italic}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:2px 9px;border-radius:100px;width:fit-content}
.badge-gold{background:rgba(196,154,42,.12);border:1px solid rgba(196,154,42,.38);color:var(--gold)}
.badge-red{background:rgba(122,21,21,.09);border:1px solid rgba(122,21,21,.22);color:var(--cr)}

.card-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.price-single{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--cr)}
.price-sizes{display:flex;gap:5px}
.chip{display:flex;flex-direction:column;align-items:center;background:rgba(122,21,21,.06);border:1px solid var(--border);border-radius:8px;padding:4px 8px;min-width:46px;transition:background .15s}
.card:hover .chip{background:rgba(122,21,21,.11)}
.chip-lbl{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.chip-val{font-size:.88rem;font-weight:800;color:var(--cr)}
.price-single-row{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* COMING SOON */
.coming{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px 16px;border:1.5px dashed rgba(122,21,21,.2);border-radius:14px;background:rgba(255,255,255,.5);font-size:1rem;color:var(--muted2);font-weight:700;font-style:italic}

/* NO RESULTS */
.nores{text-align:center;padding:60px 16px;font-size:1rem;color:var(--muted2);font-weight:700}
.nores strong{color:var(--cr)}

/* FOOTER */
footer{background:var(--cr);text-align:center;padding:24px 16px 100px;border-top:3px solid var(--gold);color:rgba(253,246,233,.55);font-size:12px;font-weight:600}
footer b{display:block;font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--gold2);letter-spacing:.2em;margin-bottom:6px}
footer a{color:var(--gold2);text-decoration:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:380px){
  .cat-circle{width:60px;height:60px;font-size:1.85rem}
  .chip{min-width:40px;padding:3px 5px}
  .chip-val{font-size:.82rem}
  .card-name{font-size:.9rem}
  .price-single{font-size:1.1rem}
}

/* ===== CART / ADD-TO-CART CONTROLS ===== */
.add-btn{display:flex;align-items:center;gap:5px;background:var(--cr);color:var(--cream);border:none;border-radius:8px;padding:7px 13px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;letter-spacing:.03em;cursor:pointer;box-shadow:0 2px 8px rgba(122,21,21,.25);transition:background .15s,transform .1s;white-space:nowrap}
.add-btn:hover{background:var(--cr2)}
.add-btn:active{transform:scale(.94)}
.stepper{display:flex;align-items:center;gap:0;background:var(--cr);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(122,21,21,.25)}
.stepper button{background:none;border:none;color:var(--cream);width:26px;height:28px;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.stepper button:active{background:rgba(0,0,0,.15)}
.stepper .qty-num{min-width:20px;text-align:center;font-size:13px;font-weight:800;color:var(--cream)}

.chip.chipable{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,transform .1s}
.chip.chipable:active{transform:scale(.95)}
.chip.chipable.in-cart{background:var(--cr);border-color:var(--cr)}
.chip.chipable.in-cart .chip-lbl{color:rgba(253,246,233,.75)}
.chip.chipable.in-cart .chip-val{color:var(--cream)}
.chip-stepper{display:flex;align-items:center;gap:4px;background:var(--cr);border-radius:8px;padding:2px 4px;min-width:46px;justify-content:center}
.chip-stepper button{background:none;border:none;color:var(--cream);width:18px;height:20px;font-size:13px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.chip-stepper .cs-num{font-size:12px;font-weight:800;color:var(--cream);min-width:12px;text-align:center}
.chip-stepper .cs-lbl{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(253,246,233,.7);margin-right:2px}

/* Floating cart bar */
.cart-fab{position:fixed;left:12px;right:12px;bottom:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:876px;margin:0 auto;z-index:300;background:var(--cr);color:var(--cream);border-radius:16px;padding:13px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 28px rgba(122,21,21,.4);cursor:pointer;-webkit-tap-highlight-color:transparent;border:1.5px solid var(--gold)}
.cart-fab.show{display:flex}
.cart-fab-left{display:flex;align-items:center;gap:10px}
.cart-fab-count{background:var(--gold);color:var(--cr);font-weight:900;font-size:13px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cart-fab-text{font-weight:800;font-size:13px}
.cart-fab-text small{display:block;font-weight:600;font-size:10px;color:rgba(253,246,233,.65);margin-top:1px}
.cart-fab-right{display:flex;align-items:center;gap:6px;font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;color:var(--gold2)}

/* Overlay + drawer */
.ov{position:fixed;inset:0;background:rgba(26,13,0,.55);z-index:400;display:none;opacity:0;transition:opacity .2s}
.ov.show{display:block;opacity:1}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:401;background:var(--cream);border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 40px rgba(0,0,0,.3);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.show{transform:translateY(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:2px solid var(--border);flex-shrink:0}
.drawer-head h3{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--cr)}
.drawer-close{background:rgba(122,21,21,.08);border:none;width:30px;height:30px;border-radius:50%;color:var(--cr);font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.drawer-body{overflow-y:auto;padding:12px 18px;flex:1}
.drawer-foot{flex-shrink:0;padding:14px 18px;border-top:2px solid var(--border);background:var(--white)}

.cart-empty{text-align:center;padding:50px 16px;color:var(--muted2);font-weight:700}
.cart-empty span{font-size:2.4rem;display:block;margin-bottom:10px}

.cart-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.cart-row:last-child{border-bottom:none}
.cart-row-info{flex:1;min-width:0}
.cart-row-name{font-weight:800;font-size:.92rem;color:var(--dark);line-height:1.3}
.cart-row-variant{font-size:11px;color:var(--muted2);font-weight:700;margin-top:1px}
.cart-row-price{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.cart-row-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.cart-row-total{font-family:'Playfair Display',serif;font-weight:700;color:var(--cr);font-size:1rem;min-width:52px;text-align:right}
.cart-row-remove{background:none;border:none;color:var(--muted2);font-size:16px;cursor:pointer;padding:2px 4px}

.sum-line{display:flex;justify-content:space-between;align-items:center;font-size:.92rem;font-weight:700;color:var(--muted);padding:3px 0}
.sum-line.total{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--cr);padding-top:8px;margin-top:4px;border-top:1.5px dashed var(--border)}

.btn-primary{width:100%;background:var(--cr);color:var(--cream);border:none;border-radius:12px;padding:14px;font-family:'Nunito',sans-serif;font-size:14.5px;font-weight:800;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 14px rgba(122,21,21,.3);margin-top:10px;transition:background .15s}
.btn-primary:hover{background:var(--cr2)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-primary.wa{background:#1F7A3D}
.btn-primary.wa:hover{background:#25923F}
.btn-ghost{width:100%;background:none;border:1.5px solid var(--border);color:var(--muted);border-radius:12px;padding:11px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;margin-top:8px}

.step-tabs{display:flex;gap:8px;margin-bottom:14px}
.step-dot{flex:1;height:4px;border-radius:4px;background:var(--border)}
.step-dot.active{background:var(--cr)}

.order-type-row{display:flex;gap:10px;margin-bottom:14px}
.ot-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border:2px solid var(--border);border-radius:14px;background:var(--white);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s}
.ot-btn span.ic{font-size:1.6rem}
.ot-btn span.tx{font-size:12.5px;font-weight:800;color:var(--dark)}
.ot-btn.sel{border-color:var(--cr);background:rgba(122,21,21,.06)}
.ot-btn.sel span.tx{color:var(--cr)}

.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--muted2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1.5px solid var(--border);background:var(--white);border-radius:10px;padding:10px 12px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:var(--dark);outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--cr)}
.field textarea{resize:vertical;min-height:56px}

.notice{display:flex;gap:9px;background:rgba(196,154,42,.1);border:1.5px solid rgba(196,154,42,.4);border-radius:12px;padding:11px 12px;margin-bottom:4px}
.notice .nic{font-size:1.1rem;flex-shrink:0;line-height:1}
.notice .ntx{font-size:12px;font-weight:700;color:#7A5A10;line-height:1.4}

.back-link{background:none;border:none;color:var(--muted2);font-size:12.5px;font-weight:800;cursor:pointer;padding:4px 0 12px;display:flex;align-items:center;gap:4px}

/* item pill (opens size/portion picker) */
.item-pill{display:flex}
.variant-pill{display:flex;align-items:center;gap:6px;background:var(--cr);color:var(--cream);border:none;border-radius:100px;padding:7px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(122,21,21,.25);white-space:nowrap;-webkit-tap-highlight-color:transparent}
.variant-pill:active{transform:scale(.96)}
.vp-qty{background:var(--gold);color:var(--cr);width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vp-arrow{opacity:.7;font-weight:900}

/* size / portion picker modal rows */
.modal-item-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--dark);margin-bottom:2px}
.modal-item-sub{font-size:11.5px;font-weight:700;color:var(--muted2);margin-bottom:14px}
.size-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.size-row:last-child{border-bottom:none}
.size-row-name{font-weight:800;font-size:.95rem;color:var(--dark)}
.size-row-price{font-size:12.5px;color:var(--cr);font-weight:800;margin-top:2px;font-family:'Playfair Display',serif}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="logo">BILANDI'S<small>Cafe · Bakery · Grocery</small></div>
    <div class="nav-search">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="si" type="text" placeholder="Search dishes…" autocomplete="off" autocorrect="off">
    </div>
    <a class="nav-link" href="https://www.bilandis.com" target="_blank">↗ bilandis.com</a>
  </div>
</nav>
<div class="gline"></div>

<div class="hero">
  <h1>What are you <em>craving</em>?</h1>
  <p>Pure Veg &nbsp;·&nbsp; Freshly Made &nbsp;·&nbsp; Gajsinghpur</p>
</div>

<div class="cats">
  <div class="cats-title">Browse by Category</div>
  <div class="cats-row" id="cats"></div>
</div>

<main class="main" id="main"></main>

<footer>
  <b>✦ BILANDI'S ✦</b>
  Pure Vegetarian 🌿 &nbsp;·&nbsp; All prices in ₹ &nbsp;·&nbsp; <a href="https://www.bilandis.com">bilandis.com</a>
</footer>

<!-- Floating cart bar -->
<div class="cart-fab" id="cartFab">
  <div class="cart-fab-left">
    <div class="cart-fab-count" id="fabCount">0</div>
    <div class="cart-fab-text">View Cart<small id="fabItemsLbl">0 items</small></div>
  </div>
  <div class="cart-fab-right">₹<span id="fabTotal">0</span> ›</div>
</div>

<!-- Overlay -->
<div class="ov" id="ov"></div>

<!-- Cart drawer -->
<div class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <h3>Your Cart</h3>
    <button class="drawer-close" id="cartClose">✕</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</div>

<!-- Checkout drawer -->
<div class="drawer" id="checkoutDrawer">
  <div class="drawer-head">
    <h3>Place Your Order</h3>
    <button class="drawer-close" id="checkoutClose">✕</button>
  </div>
  <div class="drawer-body" id="checkoutBody"></div>
  <div class="drawer-foot" id="checkoutFoot"></div>
</div>

<!-- Size / portion picker drawer -->
<div class="drawer" id="sizeDrawer">
  <div class="drawer-head">
    <h3>Select Options</h3>

// Replace with the restaurant's WhatsApp number in international format, no + or spaces, e.g. "919812345678"
const WHATSAPP_NUMBER = "919828298009";

const CALL_NUMBER = "+91 98282 98009";

/* cart = { vid: {name, variant, price, qty} } */
let cart = {};

function vid(si,ii,label){ return si+'_'+ii+'_'+(label||'base'); }

function cartCount(){ return Object.values(cart).reduce((a,c)=>a+c.qty,0); }
function cartTotal(){ return Object.values(cart).reduce((a,c)=>a+c.qty*c.price,0); }

function changeQty(id,name,variant,price,delta){
  if(!cart[id]) cart[id]={name,variant,price,qty:0};
  cart[id].qty += delta;
  if(cart[id].qty<=0) delete cart[id];
  syncQtyUI();
  updateFab();
  if(cartDrawer.classList.contains('show')) renderCartDrawer();
}

function syncQtyUI(){
  document.querySelectorAll('[data-vid]').forEach(el=>{
    const id = el.dataset.vid;
    const q = cart[id] ? cart[id].qty : 0;
    const numEl = el.querySelector('.qty-num, .cs-num');
    if(numEl) numEl.textContent = q;
    el.classList.toggle('has-qty', q>0);
    if(el.classList.contains('add-slot')){
      el.innerHTML = q>0 ? stepperHTML(id,q) : addBtnHTML(id);
    }
    if(el.classList.contains('chip-slot')){
      const label = el.dataset.label, price = el.dataset.price;
      el.outerHTML = chipHTML(id, label, price, q);
    }
  });
  refreshPills();
}

function addBtnHTML(id){
  return `<button class="add-btn" data-act="add" data-vid="${id}">+ Add</button>`;
}
function stepperHTML(id,q){
  return `<div class="stepper"><button data-act="dec" data-vid="${id}">−</button><span class="qty-num">${q}</span><button data-act="inc" data-vid="${id}">+</button></div>`;
}
function chipHTML(id,label,price,q){
  if(q>0){
    return `<div class="chip-slot chip chipable in-cart" data-vid="${id}" data-label="${label}" data-price="${price}">
      <div class="chip-stepper"><span class="cs-lbl">${label}</span><button data-act="dec" data-vid="${id}">−</button><span class="cs-num">${q}</span><button data-act="inc" data-vid="${id}">+</button></div>
    </div>`;
  }
  return `<div class="chip-slot chip chipable" data-vid="${id}" data-act="add" data-label="${label}" data-price="${price}">
    <span class="chip-lbl">${label}</span><span class="chip-val">₹${price}</span>
  </div>`;
}

/* ===== size/portion picker (pizza sizes, noodle half-full, etc.) ===== */
function itemVariants(si,ii){
  const it = MENU[si].items[ii];
  if(it.prices) return it.prices.map((p,i)=>({label:SZ[i]==='S'?'Small':SZ[i]==='M'?'Medium':'Large', short:SZ[i], price:p, id:vid(si,ii,SZ[i])}));
  if(it.halfFull) return [{label:'Half',short:'Half',price:it.halfFull[0],id:vid(si,ii,'Half')},{label:'Full',short:'Full',price:it.halfFull[1],id:vid(si,ii,'Full')}];
  return [];
}
function itemQtyTotal(si,ii){
  return itemVariants(si,ii).reduce((a,v)=>a+(cart[v.id]?cart[v.id].qty:0),0);
}
function itemPriceTotal(si,ii){
  return itemVariants(si,ii).reduce((a,v)=>a+(cart[v.id]?cart[v.id].qty*v.price:0),0);
}
function pillHTML(si,ii){
  const q=itemQtyTotal(si,ii);
  if(q>0){
    return `<button class="variant-pill" data-act="pick-size" data-si="${si}" data-ii="${ii}"><span class="vp-qty">${q}</span> in cart · ₹${itemPriceTotal(si,ii)} <span class="vp-arrow">›</span></button>`;
  }
  return `<button class="add-btn" data-act="pick-size" data-si="${si}" data-ii="${ii}">+ Add</button>`;
}
function refreshPills(){
  document.querySelectorAll('.item-pill').forEach(el=>{
    const si=+el.dataset.si, ii=+el.dataset.ii;
    el.innerHTML = pillHTML(si,ii);
  });
}

function sizeRowHTML(v){
  const c=cart[v.id];

    <div class="size-row-info">

      <div class="size-row-price">₹${v.price}</div>

  </div>`;
}

function renderSizeModal(si,ii){
  const it = MENU[si].items[ii];
  const variants = itemVariants(si,ii);
  const kind = it.prices ? 'Choose a Size' : 'Choose a Portion';

  sizeBody.dataset.si=si; sizeBody.dataset.ii=ii;
  sizeBody.innerHTML = `
    <div class="modal-item-title">${x(it.name)}</div>
    <div class="modal-item-sub">${kind} — tap + to add</div>
    ${variants.map(sizeRowHTML).join('')}
  `;
  const total = itemPriceTotal(si,ii), qty = itemQtyTotal(si,ii);
  sizeFoot.innerHTML = `<button class="btn-primary" id="sizeDone">${qty>0 ? `Done — ₹${total}` : 'Close'}</button>`;
  document.getElementById('sizeDone').addEventListener('click', ()=>{
    closeAllDrawers();
    render(document.querySelector('.cat-btn.active').dataset.cat, document.getElementById('si').value);
  });
}

sizeBody.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const id=t.dataset.vid, act=t.dataset.act;
  const si=+sizeBody.dataset.si, ii=+sizeBody.dataset.ii;
  const variants = itemVariants(si,ii);
  const v = variants.find(x=>x.id===id);
  if(!v) return;
  if(act==='inc') changeQty(id, MENU[si].items[ii].name, v.label, v.price, 1);
  else if(act==='dec') changeQty(id, MENU[si].items[ii].name, v.label, v.price, -1);
  renderSizeModal(si,ii);
});

function x(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#x27;')}

function render(filter,search){
  mainEl.innerHTML='';
  const sq=(search||'').toLowerCase().trim();

  MENU.forEach((sec,si)=>{
    if(filter!=='all'&&filter!==sec.cat)return;

    if(sec.comingSoon){
      if(sq)return;
      const s=document.createElement('section');
      s.className='sec';s.id='s-'+sec.cat.replace(/\s+/g,'_');
      s.style.animationDelay=si*.03+'s';
      s.innerHTML=`<div class="sec-head"><span class="sec-ico">${sec.icon}</span><h2 class="sec-name">${x(sec.cat)}</h2></div><div class="coming">✨ Something delicious coming soon…</div>`;
      mainEl.appendChild(s);return;
    }

    const filtItems = sq ? sec.items.map((it,ii)=>({it,ii})).filter(o=>o.it.name.toLowerCase().includes(sq)) : sec.items.map((it,ii)=>({it,ii}));
    if(!filtItems.length)return;

    const s=document.createElement('section');
    s.className='sec';s.id='s-'+sec.cat.replace(/\s+/g,'_');
    s.style.animationDelay=si*.03+'s';
    s.innerHTML=`<div class="sec-head"><span class="sec-ico">${sec.icon}</span><h2 class="sec-name">${x(sec.cat)}</h2><span class="sec-count">${filtItems.length} item${filtItems.length>1?'s':''}</span></div>`;

    const list=document.createElement('div');list.className='items-list';

    filtItems.forEach(({it,ii})=>{
      const c=document.createElement('div');
      c.className='card'+(it.special?' special':'')+(it.highlight?' highlight':'');

      let nameH=x(it.name).replace("Bilandi&#x27;s Special","<em>Bilandi's Special</em>");

      // Price / add-to-cart HTML
      let priceH='';
      if(it.prices || it.halfFull){
        priceH=`<div class="item-pill" data-si="${si}" data-ii="${ii}">${pillHTML(si,ii)}</div>`;
      } else {
        const id=vid(si,ii,'');
        const q=cart[id]?cart[id].qty:0;
        priceH=`<div class="price-single-row"><span class="price-single">₹${it.price}</span><div class="add-slot" data-vid="${id}">${q>0?stepperHTML(id,q):addBtnHTML(id)}</div></div>`;
      }

      let badgeH='';
      if(it.highlight) badgeH='<span class="badge badge-red">🌟 Must Try</span>';
      else if(it.special) badgeH='<span class="badge badge-gold">⭐ Chef\'s Pick</span>';

      c.innerHTML=`
        <div class="card-left">
          <div class="card-namerow"><div class="veg"></div><div class="card-name">${nameH}</div></div>
          ${badgeH}
        </div>
        <div class="card-right">${priceH}</div>`;

      // attach item meta for cart use
      c.dataset.si=si; c.dataset.ii=ii;
      list.appendChild(c);
    });

    s.appendChild(list);mainEl.appendChild(s);
  });

  if(!mainEl.children.length){
    mainEl.innerHTML=`<div class="nores">No dishes found for "<strong>${x(search)}</strong>"<br><br>Try a different keyword 🙏</div>`;
  }
}

  if(act==='add' || act==='inc') changeQty(id,name,variant,price,1);

function renderCartDrawer(){
  const entries=Object.entries(cart);
  if(!entries.length){
    cartBody.innerHTML=`<div class="cart-empty"><span>🛒</span>Your cart is empty<br>Add something tasty!</div>`;
    cartFoot.innerHTML='';
    return;
  }
  cartBody.innerHTML = entries.map(([id,c])=>`
    <div class="cart-row">
      <div class="cart-row-info">
        <div class="cart-row-name">${x(c.name)}</div>
        ${c.variant?`<div class="cart-row-variant">${x(c.variant)}</div>`:''}
        <div class="cart-row-price">₹${c.price} each</div>
      </div>
      <div class="cart-row-right">
        <div class="stepper"><button data-act="dec" data-vid="${id}">−</button><span class="qty-num">${c.qty}</span><button data-act="inc" data-vid="${id}">+</button></div>
        <div class="cart-row-total">₹${c.qty*c.price}</div>
        <button class="cart-row-remove" data-act="rm" data-vid="${id}">✕</button>
      </div>
    </div>
  `).join('');

  const total=cartTotal();
  cartFoot.innerHTML=`
    <div class="sum-line"><span>Items</span><span>${cartCount()}</span></div>
    <div class="sum-line total"><span>Total</span><span>₹${total}</span></div>
    <button class="btn-primary" id="toCheckout">Proceed to Order →</button>
  `;
  document.getElementById('toCheckout').addEventListener('click', openCheckout);
}

cartBody.addEventListener('click', e=>{

  const id=t.dataset.vid, act=t.dataset.act;
  if(act==='rm'){ delete cart[id]; }
  else if(act==='inc'){ cart[id].qty+=1; }
  else if(act==='dec'){ cart[id].qty-=1; if(cart[id].qty<=0) delete cart[id]; }
  syncQtyUI(); updateFab(); renderCartDrawer();
});

}

function renderCheckoutStep1(){
  checkoutBody.innerHTML = `
    <div class="step-tabs"><div class="step-dot active"></div><div class="step-dot"></div></div>
    <div class="notice"><span class="nic">🛵</span><span class="ntx">How would you like to get your order?</span></div>
    <div class="order-type-row">
      <div class="ot-btn" data-ot="Takeaway"><span class="ic">🥡</span><span class="tx">Takeaway</span></div>
      <div class="ot-btn" data-ot="Delivery"><span class="ic">🏠</span><span class="tx">Delivery</span></div>
    </div>
  `;
  checkoutFoot.innerHTML = `<button class="btn-primary" id="step1Next" disabled>Continue</button>`;
  checkoutBody.querySelectorAll('.ot-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      checkoutBody.querySelectorAll('.ot-btn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      orderType=b.dataset.ot;
      document.getElementById('step1Next').disabled=false;
    });
  });
  document.getElementById('step1Next').addEventListener('click', renderCheckoutStep2);
}

function renderCheckoutStep2(){
  checkoutBody.innerHTML = `
    <button class="back-link" id="backStep1">‹ Back</button>
    <div class="step-tabs"><div class="step-dot active"></div><div class="step-dot active"></div></div>
    <div class="field"><label>Your Name</label><input type="text" id="custName" placeholder="e.g. Rahul Sharma"></div>
    <div class="field"><label>Phone Number</label><input type="tel" id="custPhone" placeholder="10-digit mobile number"></div>
    ${orderType==='Delivery' ? `<div class="field"><label>Delivery Address</label><textarea id="custAddr" placeholder="House no., street, landmark, area"></textarea></div>` : ''}
    <div class="field"><label>Any Instructions (optional)</label><textarea id="custNote" placeholder="e.g. less spicy, extra napkins"></textarea></div>
    <div class="notice"><span class="nic">⚠️</span><span class="ntx">Sending this order on WhatsApp is only a request — it does <b>not</b> place your order automatically. Please wait for our confirmation before it's final.</span></div>
  `;
  checkoutFoot.innerHTML = `<button class="btn-primary wa" id="sendWa">📲 Send Order on WhatsApp</button>`;
  document.getElementById('backStep1').addEventListener('click', renderCheckoutStep1);
  document.getElementById('sendWa').addEventListener('click', sendToWhatsApp);
}

function sendToWhatsApp(){
  const name=(document.getElementById('custName').value||'').trim();
  const phone=(document.getElementById('custPhone').value||'').trim();
  const addr = orderType==='Delivery' ? (document.getElementById('custAddr').value||'').trim() : '';
  const note=(document.getElementById('custNote').value||'').trim();

  if(!name || !phone){
    alert('Please enter your name and phone number.');
    return;
  }
  if(orderType==='Delivery' && !addr){
    alert('Please enter your delivery address.');
    return;
  }

  const entries=Object.entries(cart);
  if(!entries.length){
    alert('Your cart is empty.');
    return;
  }

  let msg = `🍽️ *New Order — Bilandi's Cafe*\n\n`;
  msg += `*Order Type:* ${orderType}\n`;
  msg += `*Name:* ${name}\n`;
  msg += `*Phone:* ${phone}\n`;
  if(addr) msg += `*Address:* ${addr}\n`;
  msg += `\n*Items:*\n`;
  entries.forEach(([id,c])=>{
    const label = c.variant ? ` (${c.variant})` : '';
    msg += `• ${c.name}${label} x${c.qty} — ₹${c.qty*c.price}\n`;
  });
  msg += `\n*Total: ₹${cartTotal()}*\n`;
  if(note) msg += `\n*Instructions:* ${note}\n`;
  msg += `\n⚠️ _Please note: sending this message does not place your order. Your order is only confirmed once you call._`;

  const url = `https://wa.me/${9828298009}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  alert('✅ Order sent!\n\n📞 Please call us right after sending your order to confirm it — otherwise your order will NOT be placed.\n\nCall: ' + CALL_NUMBER);
}

updateFab();
</script>
